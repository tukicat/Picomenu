# PicoMenu settings
# Change a value, or put # in
# front to use the default.
# Help has the choices.

[Display]
# dark or light
theme = dark

[Browse]
# off, on or last
show_all = off
details = off
# name, reverse or type
sort = name   # my own note
# first, last or mixed
folders = first
# sd, flash or last
start_drive = sd
start_folder = /

[Saving]
# auto, sna, z80 or szx
save_type = auto
# ask, overwrite or new
quick_save = ask
# S opens: slots or named
save_screen = slots
# ask or never
slots_on_load = ask

[Buttons]
# 0.5 to 5 seconds, or off
long_press = 1.0
# grab or off
double_press = grab

[Converting]
# on or off
loading_grab = on

[Waste Bin]
# on or off
waste_bin = on

[Screen grab order]
# V shows a game's pictures
# in this order. Put # in
# front of a kind to hide it.
From File
Loading Screen
Menu Screen
Game Screen
Ending Screen
Standard Screen Number
